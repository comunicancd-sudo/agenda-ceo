<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Agenda CEO">
<title>Agenda CEO · NCD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calma, executiva, segura — a agenda de bolso de uma presidente.
   IDEA: um caderno de compromissos encadernado em laranja NCD; voos como cartões de embarque.
   PICTURE: a própria agenda — calendário do mês + lista do dia com horários grandes pendurados.
   COLOUR and TYPE: laranja NCD #E88C08 dominante, preto/tinta, branco; Montserrat (letra do selo) + Inter.
   LAYOUT: faixa preta de topo; coluna do calendário à esquerda, dia à direita; empilha abaixo de 900px. */
:root{color-scheme:light dark;
 --bg:light-dark(#f4f2ef,#121110);--card:light-dark(#ffffff,#1c1a18);--ink:light-dark(#151312,#f3efe9);
 --soft:light-dark(#6d6862,#a49d94);--line:light-dark(#e6e1da,#2e2a26);--o:#e88c08;--o2:light-dark(#c06f00,#ffae3b);
 --otint:light-dark(#fdf0dc,#3a2a12);--top:#0f0e0d;--ok:light-dark(#1f7a4d,#5fd39a);--danger:light-dark(#b42318,#ff8a80);
 --shadow:light-dark(0 1px 2px rgba(20,16,10,.06),0 1px 2px rgba(0,0,0,.4))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.mont{font-family:Montserrat,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{background:var(--top);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 14px max(4vw,16px,env(safe-area-inset-left));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:44px;height:44px}
.brand b{display:block;font:700 18px/1.1 Montserrat,sans-serif;letter-spacing:.01em}
.brand span{font-size:13px;color:#bdb6ad}
.tabs{display:flex;gap:4px;background:#24211e;border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:#d8d2ca;padding:8px 18px;border-radius:999px;font:600 14px Montserrat,sans-serif;display:flex;gap:8px;align-items:center;min-height:40px}
.tabs button[aria-selected=true]{background:var(--o);color:#1a1206}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:#bdb6ad}
.role select{background:#24211e;color:#fff;border:1px solid #3a3530;border-radius:10px;padding:8px 10px;font-size:14px}
.pill-role{background:#24211e;border-radius:999px;padding:7px 12px;color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;min-height:44px;font:600 15px Montserrat,sans-serif;background:var(--o);color:#1a1206}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid currentColor}

.note{margin:0;padding:10px max(4vw,16px);background:var(--otint);color:var(--ink);font-size:14px;display:none}
.note.on{display:block}

main{max-width:1280px;margin:0 auto;padding:24px max(4vw,16px) 64px}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.grid>aside{order:2}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* calendário */
.cal{padding:18px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{font-size:19px;margin:0 auto 0 0}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.dow span{font-size:12px;color:var(--soft);font-weight:600;padding:4px 0}
.day{position:relative;border:0;background:none;border-radius:12px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 14px Montserrat,sans-serif;padding:0}
.day:hover{background:var(--otint)}
.day.out{opacity:.35}
.day.today .n{background:var(--ink);color:var(--bg);border-radius:999px;width:28px;height:28px;display:grid;place-items:center}
.day.sel{background:var(--o);color:#1a1206}
.day.sel .n{background:#1a1206;color:#fff}
.day.off .n{text-decoration:underline dotted;text-underline-offset:3px}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--o)}
.day.sel .dots i{background:#1a1206}
.dots i.k{background:none;border:1.5px solid var(--soft)}
.dots i.ok{background:var(--ok)}
.dots svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--soft);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:9px;background:var(--o);display:inline-block}
.legend i.k{background:none;border:1.5px solid var(--soft)}
.legend i.ok{background:var(--ok)}

.stat{padding:18px;margin-top:16px}
.stat h3{margin:0 0 4px;font-size:15px}
.big{font:700 34px/1 Montserrat,sans-serif;letter-spacing:-.01em}
.big small{font-size:15px;color:var(--soft);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar b{display:block;height:100%;background:var(--o);border-radius:9px;transition:width .4s}
.muted{color:var(--soft);font-size:13.5px}
.nextfl{padding:18px;margin-top:16px;cursor:pointer;border:0;text-align:left;width:100%;display:block}
.nextfl .route{display:flex;align-items:center;gap:10px;font:800 26px Montserrat,sans-serif;margin:6px 0}
.nextfl .route svg{width:22px;height:22px;color:var(--o)}

/* dia */
.dayhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.dayhead h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.dayhead .wk{display:block;font:600 14px Inter,sans-serif;color:var(--o2);letter-spacing:0;margin-bottom:4px}
.dayhead .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font:600 13.5px Montserrat,sans-serif;min-height:36px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;min-height:38px}
.chip[aria-pressed=true]{border-color:var(--o);background:var(--otint);color:var(--ink);font-weight:600}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;min-height:42px}
.search input{border:0;background:none;outline:none;width:100%;font-size:16px;padding:8px 0}

.aviso{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:12px;font:600 14px Montserrat,sans-serif;flex-wrap:wrap}
.aviso svg{color:var(--o)}
.aviso .ed{margin-left:auto}
.aviso .ed button{background:none;border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:8px;padding:4px 10px;font-size:12.5px;min-height:32px}
:root[data-theme=dark] .aviso .ed button{border-color:rgba(0,0,0,.3)}

.list{display:flex;flex-direction:column;gap:10px}
.it{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:start}
.time{font:700 20px/1.2 Montserrat,sans-serif;text-align:right;padding-top:16px;white-space:nowrap}
.time small{display:block;font-size:13px;color:var(--soft);font-weight:600}
.time.allday{font-size:12.5px;color:var(--soft);font-weight:600;padding-top:20px}
.box{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.box.know{background:transparent;border-style:dashed}
.box h3{margin:0;font-size:16.5px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.done .box h3{text-decoration:line-through;text-decoration-color:var(--soft);color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.p{background:var(--o);color:#1a1206}
.tag.k{border:1.5px solid var(--soft);color:var(--soft);padding:2px 9px}
.tag.c{color:var(--soft);padding-left:2px}
.tag.c i{width:8px;height:8px;border-radius:9px;display:inline-block}
.tag svg{width:14px;height:14px}
button.tag{border:0;font-family:inherit}
button.tag.k{border:1.5px solid var(--soft);background:none}
.meta{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:14px;color:var(--soft)}
.meta div{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.meta svg{width:16px;height:16px;margin-top:2px}
.meta a{color:var(--o2);font-weight:600}
.desc{white-space:pre-wrap;margin-top:8px;font-size:14px;overflow-wrap:anywhere}
.adm{display:flex;gap:6px;margin-top:10px}
.check{width:48px;height:48px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;margin-top:8px;color:transparent;transition:background .2s,border-color .2s}
.check:hover{border-color:var(--o)}
.check svg{width:24px;height:24px;stroke-width:3}
.done .check{background:var(--o);border-color:var(--o);color:#1a1206}
.check.k{width:auto;height:36px;border-radius:999px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--soft);display:flex;gap:6px;margin-top:12px}
.check.k svg{width:16px;height:16px;color:transparent}
.done .check.k{background:var(--otint);border-color:var(--o);color:var(--ink)}
.done .check.k svg{color:var(--o2)}
.check[disabled]{cursor:default;opacity:.7}
@media(prefers-reduced-motion:no-preference){.done .check svg{animation:pop .3s ease}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media(max-width:600px){.it{grid-template-columns:52px minmax(0,1fr) auto;gap:8px}.time{font-size:16px}.check{width:42px;height:42px}.check.k{width:42px;height:42px;padding:0;justify-content:center;margin-top:8px}.check.k .tx{display:none}.check.k svg{width:20px;height:20px}.tag{white-space:normal}.box{padding:12px 13px}}

.empty{padding:28px;text-align:center;color:var(--soft);border:1.5px dashed var(--line);border-radius:16px}
.wday{margin:22px 0 8px;font:700 15px Montserrat,sans-serif;display:flex;gap:10px;align-items:baseline}
.wday button{border:0;background:none;padding:0;font:inherit;color:inherit}
.wday span{color:var(--soft);font-weight:600;font-size:13px;text-transform:none}

/* voo mini e cartão de embarque */
.fl{display:grid;grid-template-columns:minmax(0,1fr) auto;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.fl .main{padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.fl .ap b{display:block;font:800 clamp(26px,4vw,34px)/1 Montserrat,sans-serif;letter-spacing:.02em}
.fl .ap span{display:block;font-size:12.5px;color:var(--soft);margin-top:4px}
.fl .ap .t{font:700 17px Montserrat,sans-serif;color:var(--ink);margin-top:6px}
.fl .ap.r{text-align:right}
.fl .path{display:flex;align-items:center;gap:6px;color:var(--o);padding:0 clamp(4px,2vw,24px)}
.fl .path i{flex:1;border-top:2px dashed var(--line)}
.fl .path svg{width:22px;height:22px}
.fl .stub{background:var(--o);color:#1a1206;padding:14px 18px;display:flex;flex-direction:column;gap:6px;justify-content:center;border-left:2px dashed rgba(0,0,0,.25);width:240px}
.fl .stub b{font:700 15px Montserrat,sans-serif}
.fl .stub small{font-size:12px;opacity:.8;display:block}
.fl .stub .loc{display:flex;align-items:center;gap:6px;font:700 17px Montserrat,sans-serif;letter-spacing:.06em}
.fl .stub button{border:0;background:rgba(0,0,0,.12);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;min-height:28px}
.fl .foot{grid-column:1/-1;padding:10px 18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.fl.past{opacity:.55}
@media(max-width:600px){.fl{grid-template-columns:minmax(0,1fr)}.fl .stub{width:auto;border-left:0;border-top:2px dashed rgba(0,0,0,.25);flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 18px}}
.flday{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px}
@media(max-width:600px){.flday{grid-template-columns:58px minmax(0,1fr);gap:10px}}

.voos h1{font-size:clamp(28px,4vw,44px);margin:0;line-height:1.05}
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px}
.vhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.vlist{display:flex;flex-direction:column;gap:12px}
.vdate{font:700 14px Montserrat,sans-serif;margin:18px 0 0;color:var(--soft)}
.vmonth{font:800 22px Montserrat,sans-serif;margin:30px 0 4px}

/* modal */
dialog{border:0;border-radius:20px;padding:0;width:min(620px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,6,.55)}
.mhead{background:var(--top);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.mhead h2{margin:0;font-size:19px;margin-right:auto}
.mhead button{background:none;border:0;color:#fff;width:40px;height:40px}
form.f{padding:20px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.f .full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:400;min-height:44px}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--o);outline:none}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{flex-direction:row;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:500}
.choice label b{display:block;font:700 14.5px Montserrat,sans-serif}
.choice label span{font-size:12.5px;color:var(--soft)}
.choice input{min-height:0;margin-top:3px;accent-color:var(--o);width:18px;height:18px}
.choice label:has(input:checked){border-color:var(--o);background:var(--otint)}
.factions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}
.factions .del{margin-right:auto}
.inline{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:500!important}
.inline input{min-height:0!important;width:18px;height:18px;accent-color:var(--o)}
@media(max-width:600px){form.f{grid-template-columns:minmax(0,1fr)}.choice{grid-template-columns:1fr}}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .25s;z-index:20;max-width:90vw}
.toast.on{visibility:visible;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
</style>
</head>
<body>

 <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></symbol>

const AP={FLN:'Florianópolis',CGH:'São Paulo · Congonhas',GRU:'São Paulo · Guarulhos',VCP:'Campinas · Viracopos',NVT:'Navegantes',CGR:'Campo Grande',XAP:'Chapecó',CNF:'Belo Horizonte · Confins',SSA:'Salvador',LEC:'Lençóis',IGU:'Foz do Iguaçu',GIG:'Rio · Galeão',SDU:'Rio · Santos Dumont',AEP:'Buenos Aires · Aeroparque',FTE:'El Calafate',ADD:'Adis Abeba',SIN:'Singapura',DOH:'Doha',CAI:'Cairo',IST:'Istambul',POA:'Porto Alegre',CWB:'Curitiba',BSB:'Brasília',JOI:'Joinville',EZE:'Buenos Aires · Ezeiza',LIS:'Lisboa',MIA:'Miami'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const safeUrl=u=>/^https:[\/][\/]/i.test(u||'')?u:'';

const S={acts:[],fls:[],av:{},
 today:ymd(new Date()),sel:ymd(new Date()),calM:null,mode:'dia',filter:'todas',q:'',vmode:'prox',
 isAdmin:false,role:'ceo',canWrite:true,dirty:true,byDate:{},flByDate:{},avByDate:{},allActs:[],allFl:[]};
S.calM=S.sel.slice(0,7);
try{const m=localStorage.getItem('ncdMode');if(m)S.mode=m}catch(e){}

function rebuild(){
 if(!S.dirty)return;S.dirty=false;
 S.byDate={};for(const a of S.acts){(S.byDate[a.date]||(S.byDate[a.date]=[])).push(a)}
 for(const k in S.byDate)S.byDate[k].sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99')||a.id.localeCompare(b.id));
 S.allFl=S.fls.slice().sort((a,b)=>(a.date+(a.saida||'')).localeCompare(b.date+(b.saida||'')));
 S.flByDate={};for(const f of S.allFl)(S.flByDate[f.date]||(S.flByDate[f.date]=[])).push(f);
 S.avByDate=S.av;S.allActs=S.acts;
}
const isDone=a=>a.concluida==='TRUE';
const adminView=()=>S.isAdmin&&S.role==='admin';

/* ---------- calendário ---------- */
function renderCal(){
 const[y,m]=S.calM.split('-').map(Number);
 $('#calTitle').textContent=cap(MES[m-1])+' '+y;
 const first=new Date(y,m-1,1);let d=new Date(first);d.setDate(1-first.getDay());
 let h='';
 for(let i=0;i<42;i++){
  const ds=ymd(d),list=S.byDate[ds]||[],part=list.filter(a=>a.tipo!=='conhecimento'),pend=part.filter(a=>!isDone(a));
  const off=(S.avByDate[ds]||[]).some(t=>/folga|feriado|ano novo|natal/i.test(t));
  let dots='';
  if(pend.length)dots+='<i></i>'.repeat(Math.min(pend.length,3));
  else if(part.length)dots+='<i class="ok"></i>';
  if(list.length&&!part.length)dots+='<i class="k"></i>';
  if(S.flByDate[ds])dots+='<svg><use href="#i-plane"/></svg>';
  const cls=['day',d.getMonth()!==m-1?'out':'',ds===S.today?'today':'',ds===S.sel?'sel':'',off?'off':''].join(' ');
  const lbl=`${d.getDate()} de ${MES[d.getMonth()]}: ${pend.length} pendente(s)${S.flByDate[ds]?', voo':''}`;
  h+=`<button class="${cls}" data-d="${ds}" aria-label="${esc(lbl)}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  d.setDate(d.getDate()+1);
  if(i>=34&&d.getMonth()!==m-1&&d.getDay()===0)break;
 }
 $('#days').innerHTML=h;
 // stats do mês
 let tot=0,ok=0;for(const[ds,l]of Object.entries(S.byDate))if(ds.startsWith(S.calM))for(const a of l)if(a.tipo!=='conhecimento'){tot++;if(isDone(a))ok++}
 $('#stTitle').textContent='Em '+MES[m-1];
 $('#stBig').innerHTML=`${ok} <small>de ${tot}</small>`;
 $('#stBar').style.width=(tot?ok/tot*100:0)+'%';
 const pendHoje=(S.byDate[S.today]||[]).filter(a=>a.tipo!=='conhecimento'&&!isDone(a)).length;
 $('#stSub').textContent=`atividades com participação concluídas · ${pendHoje} pendente${pendHoje===1?'':'s'} hoje`;
 // próximo voo
 const now=S.today,nf=(S.allFl||[]).find(f=>f.date>=now);
 const nb=$('#nextFl');
 if(nf){const dd=parse(nf.date);nb.innerHTML=`<div class="muted">Próximo voo · ${SEM[dd.getDay()].split('-')[0]}, ${dd.getDate()} de ${MES[dd.getMonth()]}</div><div class="route">${esc(nf.origem)} ${ic('plane')} ${esc(nf.destino)}</div><div class="muted">${esc([nf.saida&&'Saída '+nf.saida,nf.cia,nf.voo,nf.localizador&&'Loc. '+nf.localizador].filter(Boolean).join(' · '))}</div>`;nb.classList.remove('hide')}
 else nb.classList.add('hide');
}

/* ---------- itens ---------- */
function passFilter(a){
 if(S.filter==='participar')return a.tipo!=='conhecimento';
 if(S.filter==='conhecimento')return a.tipo==='conhecimento';
 if(S.filter==='pendentes')return a.tipo!=='conhecimento'&&!isDone(a);
 return true;
}
function itemHTML(a){
 const k=a.tipo==='conhecimento',done=isDone(a),c=CAT[a.cat]||CAT.outro,adm=adminView();
 const time=a.hora?`<div class="time">${esc(a.hora)}${a.fim?`<small>até ${esc(a.fim)}</small>`:''}</div>`:`<div class="time allday">Dia todo</div>`;
 const tipoTag=adm?`<button class="tag ${k?'k':'p'}" data-tg="${esc(a.id)}" title="Clique para alternar">${k?ic('eye')+'Para conhecimento':ic('user')+'Participar'}</button>`
  :`<span class="tag ${k?'k':'p'}">${k?ic('eye')+'Para conhecimento':ic('user')+'Participar'}</span>`;
 const meta=[];
 if(a.local)meta.push(`<div>${ic('pin')}<span>${esc(a.local)}</span></div>`);
 if(a.contato)meta.push(`<div>${ic('phone')}<span>${esc(a.contato)}</span></div>`);
 const u=safeUrl(a.link);if(u)meta.push(`<div>${ic('video')}<a href="${esc(u)}" target="_blank" rel="noopener">Entrar na videochamada</a></div>`);
 const can=S.canWrite;
 const chk=k?`<button class="check k" data-ck="${esc(a.id)}" data-dt="${esc(a.date)}" ${can?'':'disabled'} aria-pressed="${done}" aria-label="Marcar como ciente">${ic('check')}<span class="tx">${done?'Ciente':'Marcar ciente'}</span></button>`
  :`<button class="check" data-ck="${esc(a.id)}" data-dt="${esc(a.date)}" ${can?'':'disabled'} aria-pressed="${done}" aria-label="${done?'Concluída — desmarcar':'Marcar como concluída'}">${ic('check')}</button>`;
 return `<div class="it ${done?'done':''}">${time}<div class="box ${k?'know':''}"><h3>${esc(a.titulo)}</h3>
  <div class="tags">${tipoTag}<span class="tag c"><i style="background:${c[1]}"></i>${c[0]}</span></div>
  ${meta.length?`<div class="meta">${meta.join('')}</div>`:''}${a.desc?`<div class="desc">${esc(a.desc)}</div>`:''}
  ${adm?`<div class="adm"><button class="btn ghost small" data-ed="${esc(a.id)}">${ic('edit')}Editar</button><button class="btn ghost small" data-dup="${esc(a.id)}">${ic('dup')}Duplicar</button></div>`:''}
 </div>${chk}</div>`;
}
function flMini(f){
 return `<div class="flday"><div class="time">${esc(f.saida||'')}</div><button class="fl" data-gofl style="text-align:left;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%">${flBody(f,true)}</button></div>`;
}
function flBody(f,mini){
 const o=String(f.origem||'').toUpperCase(),d=String(f.destino||'').toUpperCase();
 return `<div class="main"><div class="ap"><b>${esc(o)}</b><span>${esc(AP[o]||'')}</span>${f.saida?`<div class="t">${esc(f.saida)}</div>`:''}</div>
  <div class="path"><i></i>${ic('plane')}<i></i></div>
  <div class="ap r"><b>${esc(d)}</b><span>${esc(AP[d]||'')}</span>${f.chegada?`<div class="t">${esc(f.chegada)}</div>`:''}</div></div>
  <div class="stub"><div><small>Companhia · Voo</small><b>${esc([f.cia,f.voo].filter(Boolean).join(' · ')||'—')}</b></div>
  ${f.localizador?`<div><small>Localizador</small><span class="loc">${esc(f.localizador)}${mini?'':` <button type="button" data-copy="${esc(f.localizador)}">Copiar</button>`}</span></div>`:''}
  ${f.classe&&!mini?`<div><small>Classe</small><b>${esc(f.classe)}</b></div>`:''}</div>
  ${(!mini&&(f.obs||f.bilhete))||(mini&&f.obs)?`<div class="foot">${f.obs?`<span>${esc(f.obs)}</span>`:''}${!mini&&f.bilhete?`<span>Bilhete ${esc(f.bilhete)}</span>`:''}</div>`:''}`;
}
function avisoHTML(ds){
 const av=S.avByDate[ds]||[];const adm=adminView();
 if(!av.length&&!adm)return'';
 if(!av.length)return`<div style="margin-bottom:10px"><button class="btn ghost small" data-av="${ds}">${ic('plus')}Adicionar aviso do dia</button></div>`;
 return `<div class="aviso">${ic('lock')}<span>${av.map(esc).join(' · ')}</span>${adm?`<span class="ed"><button data-av="${ds}">Editar</button></span>`:''}</div>`;
}
function dayList(ds){
 const list=(S.byDate[ds]||[]).filter(passFilter),fl=S.filter==='todas'||S.filter==='participar'?(S.flByDate[ds]||[]):[];
 const rows=[...list.map(a=>({t:a.hora||'',h:itemHTML(a),all:!a.hora})),...fl.map(f=>({t:f.saida||'',h:flMini(f)}))];
 rows.sort((a,b)=>(a.all?-1:0)-(b.all?-1:0)||(a.t||'99').localeCompare(b.t||'99'));
 return rows.map(r=>r.h).join('');
}
function renderDay(){
 const d=parse(S.sel);
 const body=$('#dayBody');
 if(S.q.trim().length>=2){
  const q=S.q.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
  const res=S.allActs.filter(a=>passFilter(a)&&norm([a.titulo,a.local,a.desc,a.contato].join(' ')).includes(q)).sort((a,b)=>(a.date+(a.hora||'')).localeCompare(b.date+(b.hora||'')));
  $('#dayTitle').innerHTML=`<span class="wk">Busca</span>${res.length} resultado${res.length===1?'':'s'}`;
  let h='',last='';
  for(const a of res.slice(0,150)){if(a.date!==last){const dd=parse(a.date);h+=`<div class="wday"><button data-go="${a.date}">${dd.getDate()} de ${MES[dd.getMonth()]}</button><span>${cap(SEM[dd.getDay()])}</span></div>`;last=a.date}h+=itemHTML(a)}
  body.innerHTML=res.length?`<div class="list">${h}</div>${res.length>150?'<p class="muted">Mostrando os 150 primeiros.</p>':''}`:`<div class="empty">Nada encontrado para “${esc(S.q)}”.</div>`;
  return;
 }
 if(S.mode==='dia'){
  $('#dayTitle').innerHTML=`<span class="wk">${S.sel===S.today?'Hoje · '+SEM[d.getDay()]:cap(SEM[d.getDay()])}</span>${d.getDate()} de ${MES[d.getMonth()]}`;
  const l=dayList(S.sel);
  body.innerHTML=avisoHTML(S.sel)+(l?`<div class="list">${l}</div>`:`<div class="empty">${(S.byDate[S.sel]||[]).length?'Nenhuma atividade neste filtro.':'Agenda livre neste dia.'}</div>`);
 }else{
  const st=addD(S.sel,-((d.getDay()+6)%7)),en=addD(st,6),a=parse(st),b=parse(en);
  $('#dayTitle').innerHTML=`<span class="wk">Semana</span>${a.getDate()}${a.getMonth()!==b.getMonth()?' de '+MES[a.getMonth()]:''} a ${b.getDate()} de ${MES[b.getMonth()]}`;
  let h='';
  for(let i=0;i<7;i++){const ds=addD(st,i),dd=parse(ds),l=dayList(ds);
   h+=`<div class="wday"><button data-go="${ds}">${cap(SEM[dd.getDay()])}, ${dd.getDate()}</button>${ds===S.today?'<span>Hoje</span>':''}</div>${avisoHTML(ds)}${l?`<div class="list">${l}</div>`:'<div class="muted" style="padding-left:6px">Agenda livre</div>'}`}
  body.innerHTML=h;
 }
}

/* ---------- voos ---------- */
function renderVoos(){
 const all=S.allFl||[],list=S.vmode==='prox'?all.filter(f=>f.date>=S.today):all;
 $('#vSub').textContent=`${all.filter(f=>f.date>=S.today).length} próximos · ${all.length} no total`;
 let h='',lm='',ld='';
 for(const f of list){const dd=parse(f.date),mk=f.date.slice(0,7);
  if(mk!==lm){h+=`<div class="vmonth">${cap(MES[dd.getMonth()])} ${dd.getFullYear()}</div>`;lm=mk;ld=''}
  if(f.date!==ld){h+=`<div class="vdate">${cap(SEM[dd.getDay()])}, ${dd.getDate()} de ${MES[dd.getMonth()]}</div>`;ld=f.date}
  h+=`<div class="fl ${f.date<S.today?'past':''}">${flBody(f,false)}${adminView()?`<div class="foot" style="justify-content:flex-end"><button class="btn ghost small" data-edv="${esc(f.id)}">${ic('edit')}Editar voo</button></div>`:''}</div>`}
 $('#vList').innerHTML=h||`<div class="empty">Nenhum voo ${S.vmode==='prox'?'programado a partir de hoje':'cadastrado'}.</div>`;
}

function render(){
 rebuild();
 $$('.adminOnly').forEach(e=>e.classList.toggle('hide',!adminView()));
 $$('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
 $$('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===S.filter));
 $$('#vSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.vmode));
 if(!$('#v-agenda').classList.contains('hide')){renderCal();renderDay()}else renderVoos();
}

/* ---------- navegação ---------- */

 $('#v-agenda').classList.toggle('hide',v!=='agenda');$('#v-voos').classList.toggle('hide',v!=='voos');
 $('#tab-agenda').setAttribute('aria-selected',v==='agenda');$('#tab-voos').setAttribute('aria-selected',v==='voos');
 render();

const route=()=>show(location.hash==='#voos'?'voos':'agenda');
window.addEventListener('hashchange',route);
$('#tab-agenda').onclick=()=>{location.hash='agenda'};
$('#tab-voos').onclick=()=>{location.hash='voos'};

$('#calPrev').onclick=()=>{const[y,m]=S.calM.split('-').map(Number);const d=new Date(y,m-2,1);S.calM=ymd(d).slice(0,7);renderCal()};
$('#calNext').onclick=()=>{const[y,m]=S.calM.split('-').map(Number);const d=new Date(y,m,1);S.calM=ymd(d).slice(0,7);renderCal()};

$('#modeSeg').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;try{localStorage.setItem('ncdMode',S.mode)}catch(x){}render()};
$$('.chip').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;renderDay()},150)};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function note(m){const n=$('#note');n.textContent=m||'';n.classList.toggle('on',!!m)}

/* ---------- dados offline + sincronização ---------- */
const API='https://script.google.com/macros/s/AKfycby9JFyylOWHfTmmmsPiDmP63UhZiRUTEbaPCWXrFLTSom0d5rmuoZvBUigus8qXUS8T/exec';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let CHAVE=null,PAPEL=null;
let outbox=LS.get('ncdOutbox',[]);
const errMsg=e=>(e&&e.message)?e.message:'Não foi possível salvar agora.';
const findA=id=>S.acts.find(a=>a.id===id);
const findV=id=>S.fls.find(f=>f.id===id);
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function fromSheetA(r){return{id:r.id,date:r.data,hora:r.hora||'',fim:r.fim||'',titulo:r.titulo||'(sem título)',tipo:r.tipo==='conhecimento'?'conhecimento':'participar',cat:r.categoria||'outro',local:r.local||'',contato:r.contato||'',link:r.link||'',desc:r.descricao||'',concluida:String(r.concluida).toUpperCase()==='TRUE'?'TRUE':'FALSE'}}
function fromSheetV(r){const o={...r,date:r.data};delete o.data;return o}
const toSheet=a=>({id:a.id,data:a.date,hora:a.hora||'',fim:a.fim||'',titulo:a.titulo,tipo:a.tipo,categoria:a.cat||'',local:a.local||'',contato:a.contato||'',link:a.link||'',descricao:a.desc||''});
const toSheetV=f=>{const o={...f,data:f.date};delete o.date;return o};

/* aplica uma operação na cópia local (usado ao fazer a ação e ao reabrir o app com fila pendente) */
function applyLocal(op,args){
 if(op==='marcar'){const a=findA(args[0]);if(a)a.concluida=args[1]?'TRUE':'FALSE'}
 else if(op==='salvarAtividade'){const n=fromSheetA({...args[0],concluida:(findA(args[0].id)||{}).concluida||'FALSE'});const i=S.acts.findIndex(x=>x.id===n.id);if(i>=0)S.acts[i]=n;else S.acts.push(n)}
 else if(op==='excluirAtividade'){S.acts=S.acts.filter(a=>a.id!==args[0])}
 else if(op==='salvarVoo'){const n=fromSheetV(args[0]);const i=S.fls.findIndex(x=>x.id===n.id);if(i>=0)S.fls[i]=n;else S.fls.push(n)}
 else if(op==='excluirVoo'){S.fls=S.fls.filter(f=>f.id!==args[0])}
 else if(op==='salvarAviso'){if(args[1]&&args[1].length)S.av[args[0]]=args[1];else delete S.av[args[0]]}
 S.dirty=true;
}
function saveCache(){
 LS.set('ncdData',{acts:S.acts,fls:S.fls,av:S.av,papel:PAPEL,quando:Date.now()});
}
function act(op,...args){
 applyLocal(op,args);outbox.push({op,args,t:Date.now()});LS.set('ncdOutbox',outbox);saveCache();render();updateStatus();sync();
}

/* ---------- rede ---------- */
let syncing=false,again=false,lastOk=LS.get('ncdLastSync',0);
async function post(ops){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:CHAVE,ops})});
 if(!r.ok)throw new Error('Servidor respondeu '+r.status);return r.json();
}
async function sync(){
 if(!CHAVE)return;
 if(syncing){again=true;return}
 if(navigator.onLine===false){updateStatus();return}
 syncing=true;updateStatus();
 try{
  while(outbox.length){
   const lote=outbox.slice(0,50);
   const d=await post(lote.map(o=>({op:o.op,args:o.args})));
   if(d.erro)throw new Error(d.erro);
   (d.res||[]).forEach((x,i)=>{if(x&&!x.ok)toast('Uma alteração não foi aceita: '+x.erro)});
   outbox=outbox.slice(lote.length);LS.set('ncdOutbox',outbox);
  }
  if(!document.querySelector('dialog[open]')){
   const r=await fetch(API+'?api=carregar&k='+encodeURIComponent(CHAVE));
   const d=await r.json();
   if(d.erro){if(/autoriz/i.test(d.erro)){askKey('Esta chave de acesso não é válida.');return}throw new Error(d.erro)}
   PAPEL=d.papel;
   S.acts=(d.atividades||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.data)).map(fromSheetA);
   S.fls=(d.voos||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.data)).map(fromSheetV);
   S.av={};for(const x of d.avisos||[])if(x.data)S.av[x.data]=String(x.avisos||'').split('|').map(s=>s.trim()).filter(Boolean);
   for(const o of outbox)applyLocal(o.op,o.args);
   S.dirty=true;saveCache();setRole();render();
  }
  lastOk=Date.now();LS.set('ncdLastSync',lastOk);
 }catch(e){/* sem conexão ou servidor indisponível: tenta de novo depois */}
 finally{syncing=false;updateStatus();if(again){again=false;setTimeout(sync,500)}}
}
function rel(t){if(!t)return'nunca';const m=Math.round((Date.now()-t)/60000);if(m<1)return'agora';if(m<60)return'há '+m+' min';const h=Math.round(m/60);if(h<24)return'há '+h+' h';const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)}
function updateStatus(){
 const off=navigator.onLine===false,n=outbox.length;
 let m='';
 if(off)m=`Sem internet: você está vendo a agenda salva no aparelho (atualizada ${rel(lastOk)}).`+(n?` ${n} alteração${n>1?'ões':''} será${n>1?'ão':''} enviada${n>1?'s':''} quando a conexão voltar.`:'');
 else if(n)m=syncing?`Enviando ${n} alteração${n>1?'ões':''}…`:`${n} alteração${n>1?'ões':''} aguardando envio.`;
 note(m);
}

/* ---------- ações ---------- */
function toggleCheck(id){const a=findA(id);if(!a)return;act('marcar',id,!isDone(a))}
function copyText(t){
 const ok=()=>toast('Localizador copiado.');
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>legacy())}else legacy();
 function legacy(){const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();let r=false;try{r=document.execCommand('copy')}catch(x){}i.remove();r?ok():toast('Localizador: '+t)}
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-ck],[data-ed],[data-dup],[data-tg],[data-av],[data-go],[data-gofl],[data-edv],[data-copy],[data-close]');if(!t)return;
 if(t.dataset.ck)toggleCheck(t.dataset.ck);
 else if(t.dataset.ed)openA(findA(t.dataset.ed));
 else if(t.dataset.dup){const a=findA(t.dataset.dup);openA({...a,id:null},true)}
 else if(t.dataset.tg){const a=findA(t.dataset.tg);if(!a)return;act('salvarAtividade',toSheet({...a,tipo:a.tipo==='conhecimento'?'participar':'conhecimento'}));toast('Tipo alterado.')}
 else if(t.dataset.av)openN(t.dataset.av);
 else if(t.dataset.go){S.mode='dia';setSel(t.dataset.go)}
 else if('gofl' in t.dataset)location.hash='voos';
 else if(t.dataset.edv)openV(findV(t.dataset.edv));
 else if(t.dataset.copy){e.stopPropagation();copyText(t.dataset.copy)}
 else if('close' in t.dataset)t.closest('dialog').close();
});

/* atividade */
let editingA=null;
function openA(a,dup){
 const f=$('#fA');f.reset();editingA=a&&a.id?a.id:null;
 $('#dlgATitle').textContent=editingA?'Editar atividade':(dup?'Duplicar atividade':'Nova atividade');
 const v=a||{date:S.sel,tipo:'participar',cat:'reuniao'};
 for(const k of['titulo','date','cat','hora','fim','local','contato','link','desc'])if(f.elements[k])f.elements[k].value=v[k]||'';
 if(!v.cat)f.elements.cat.value='outro';
 f.elements.tipo.value=v.tipo==='conhecimento'?'conhecimento':'participar';
 $('#aDel').classList.toggle('hide',!editingA);$('.rep').classList.toggle('hide',!!editingA);
 f.elements.repAte.value=addD(v.date||S.sel,28);
 $('#dlgA').showModal();
}
$('#btnNew').onclick=()=>openA(null);
$('#fA').onsubmit=e=>{
 e.preventDefault();const f=e.target,g=k=>f.elements[k].value.trim();
 const link=g('link');if(link&&!/^https:[\/][\/]/i.test(link)){toast('O link precisa começar com https:\/\/');return}
 const base={date:g('date'),titulo:g('titulo'),cat:g('cat'),tipo:f.elements.tipo.value,hora:g('hora'),fim:g('fim'),local:g('local'),contato:g('contato'),link,desc:f.elements.desc.value.trim()};
 const dates=[base.date];
 if(!editingA&&f.elements.rep.checked){const ate=g('repAte');let d=addD(base.date,7);while(ate&&d<=ate&&dates.length<60){dates.push(d);d=addD(d,7)}}
 for(const d of dates)act('salvarAtividade',toSheet({...base,id:editingA||newId('n'),date:d}));
 $('#dlgA').close();toast(dates.length>1?`${dates.length} atividades criadas.`:'Atividade salva.');if(!editingA)setSel(base.date);
};
$('#aDel').onclick=()=>{
 if(!editingA)return;const b=$('#aDel');
 if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Confirmar exclusão';setTimeout(()=>{b.dataset.sure='';b.textContent='Excluir'},4000);return}
 b.dataset.sure='';b.textContent='Excluir';const id=editingA;$('#dlgA').close();act('excluirAtividade',id);toast('Atividade excluída.');
};

/* voo */
let editingV=null;
const VC=['date','localizador','origem','destino','saida','chegada','cia','voo','classe','bilhete','obs'];
function openV(v){
 const f=$('#fV');f.reset();editingV=v&&v.id?v.id:null;
 $('#dlgVTitle').textContent=editingV?'Editar voo':'Novo voo';
 const x=v||{date:S.today};
 for(const k of VC)f.elements[k].value=x[k]||'';
 $('#vDel').classList.toggle('hide',!editingV);$('#dlgV').showModal();
}
$('#btnNewFl').onclick=()=>openV(null);
$('#fV').onsubmit=e=>{
 e.preventDefault();const f=e.target,g=k=>f.elements[k].value.trim();
 const d={id:editingV||newId('v')};for(const k of VC){let v=g(k);if(['localizador','origem','destino'].includes(k))v=v.toUpperCase();d[k]=v}
 $('#dlgV').close();act('salvarVoo',toSheetV(d));toast('Voo salvo.');
};
$('#vDel').onclick=()=>{
 if(!editingV)return;const b=$('#vDel');
 if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Confirmar exclusão';setTimeout(()=>{b.dataset.sure='';b.textContent='Excluir'},4000);return}
 b.dataset.sure='';b.textContent='Excluir';const id=editingV;$('#dlgV').close();act('excluirVoo',id);toast('Voo excluído.');
};

/* aviso */
let editingN=null;
function openN(ds){editingN=ds;$('#fN').elements.t.value=(S.avByDate[ds]||[]).join('\n');$('#dlgN').showModal()}
$('#fN').onsubmit=e=>{e.preventDefault();const t=e.target.elements.t.value.split('\n').map(s=>s.trim()).filter(Boolean);$('#dlgN').close();act('salvarAviso',editingN,t);toast('Aviso salvo.')};

/* ---------- papel e chave de acesso ---------- */
function setRole(){
 const was=S.isAdmin;S.isAdmin=PAPEL==='admin';
 if(!S.isAdmin)S.role='ceo';else if(!was){let r=null;try{r=localStorage.getItem('ncdRole')}catch(x){}S.role=r||'admin'}
 const box=$('#rolebox');
 if(S.isAdmin){box.innerHTML=`<label for="roleSel">Visão</label><select id="roleSel"><option value="admin">Administrador</option><option value="ceo">CEO</option></select>`;
  const s=$('#roleSel');s.value=S.role;s.onchange=()=>{S.role=s.value;try{localStorage.setItem('ncdRole',S.role)}catch(x){}render()}}
 else box.innerHTML=`<span class="pill-role">${PAPEL==='ceo'?'CEO':'…'}</span>`;
}
function askKey(msg){
 const d=$('#dlgK');$('#kMsg').textContent=msg||'';if(!d.open)d.showModal();
}
$('#fK').onsubmit=e=>{e.preventDefault();let v=e.target.elements.k.value.trim();const m=v.match(/[?&]k=([A-Za-z0-9]+)/);if(m)v=m[1];
 if(!/^[A-Za-z0-9]{8,64}$/.test(v)){$('#kMsg').textContent='Cole a chave ou o link completo que você recebeu.';return}
 CHAVE=v;LS.set('ncdKey',v);$('#dlgK').close();sync()};

/* ---------- início ---------- */
function boot(){
 const q=new URLSearchParams(location.search).get('k');
 CHAVE=(q&&/^[A-Za-z0-9]{8,64}$/.test(q))?q:LS.get('ncdKey',null);
 if(q)LS.set('ncdKey',CHAVE);
 const c=LS.get('ncdData',null);
 if(c){S.acts=c.acts||[];S.fls=c.fls||[];S.av=c.av||{};PAPEL=c.papel||null;S.dirty=true}
 setRole();route();updateStatus();
 if(!CHAVE){askKey();return}
 if(!c)note(navigator.onLine===false?'Sem internet. Abra o app uma vez com internet para baixar a agenda.':'Baixando a agenda…');
 sync();
 setInterval(()=>{if(!document.hidden)sync()},30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
 window.addEventListener('online',()=>{updateStatus();sync()});
 window.addEventListener('offline',updateStatus);
}
boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
}
</script>
